version: '3.8'

services:
  # Traefik reverse proxy for routing
  traefik:
    image: traefik:v2.10
    container_name: travelai-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "8001:80"      # HTTP on port 8001
      - "8081:8080"    # Traefik dashboard on port 8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - travelai-network
    restart: unless-stopped

  # FastAPI backend service
  backend:
    build:
      context: ..
      dockerfile: webapp/backend/Dockerfile
    container_name: travelai-backend
    environment:
      # ChromaDB Configuration
      - CHROMADB_TENANT=${CHROMADB_TENANT}
      - CHROMADB_DATABASE=${CHROMADB_DATABASE}
      - CHROMADB_API_KEY=${CHROMADB_API_KEY}

      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/travelai/api`) || PathPrefix(`/travelai/health`) || PathPrefix(`/travelai/docs`) || PathPrefix(`/travelai/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Strip /travelai prefix before forwarding to backend
      - "traefik.http.middlewares.travelai-stripprefix.stripprefix.prefixes=/travelai"
      - "traefik.http.routers.backend.middlewares=travelai-stripprefix"
    networks:
      - travelai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React frontend service
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: travelai-frontend
    environment:
      - VITE_API_URL=http://34.234.128.198:8001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/travelai`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=2"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Strip /travelai prefix and serve from root
      - "traefik.http.middlewares.travelai-frontend-stripprefix.stripprefix.prefixes=/travelai"
      - "traefik.http.middlewares.travelai-frontend-stripprefix.stripprefix.forceslash=false"
      - "traefik.http.routers.frontend.middlewares=travelai-frontend-stripprefix"
    networks:
      - travelai-network
    restart: unless-stopped

networks:
  travelai-network:
    driver: bridge
