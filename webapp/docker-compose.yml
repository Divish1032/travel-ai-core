version: '3.8'

services:
  # ============================================================================
  # Traefik Reverse Proxy
  # Routes traffic to backend API and frontend React app
  # ============================================================================
  traefik:
    image: traefik:v3.0
    container_name: travelai-traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      # API and Dashboard Configuration
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Docker Provider Configuration
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=travelai-network"
      - "--providers.docker.watch=true"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8081"

      # Logging
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultmode=keep"

      # Metrics (optional)
      - "--metrics.prometheus=true"

      # Health check
      - "--ping=true"
      - "--ping.entrypoint=web"

    ports:
      - "80:80"        # HTTP traffic
      - "8081:8081"    # Traefik dashboard

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - travelai-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    labels:
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`68.233.112.202`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ============================================================================
  # FastAPI Backend Service
  # Handles /travelai/api, /travelai/health, /travelai/docs routes
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: webapp/backend/Dockerfile

    container_name: travelai-backend

    environment:
      # ChromaDB Configuration
      - CHROMADB_TENANT=${CHROMADB_TENANT}
      - CHROMADB_DATABASE=${CHROMADB_DATABASE}
      - CHROMADB_API_KEY=${CHROMADB_API_KEY}

      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    networks:
      - travelai-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "traefik.enable=true"

      # Router configuration
      - "traefik.http.routers.backend.rule=PathPrefix(`/travelai/api`) || PathPrefix(`/travelai/health`) || PathPrefix(`/travelai/docs`) || PathPrefix(`/travelai/openapi.json`) || PathPrefix(`/travelai/redoc`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"

      # Service configuration
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.services.backend.loadbalancer.server.scheme=http"

      # Health check configuration
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.timeout=3s"

      # Middleware: Strip /travelai prefix
      - "traefik.http.middlewares.travelai-stripprefix.stripprefix.prefixes=/travelai"

      # Middleware: CORS headers
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.backend-cors.headers.addvaryheader=true"

      # Middleware: Security headers
      - "traefik.http.middlewares.backend-security.headers.framedeny=true"
      - "traefik.http.middlewares.backend-security.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.backend-security.headers.browserxssfilter=true"
      - "traefik.http.middlewares.backend-security.headers.referrerpolicy=strict-origin-when-cross-origin"

      # Apply middlewares (order matters: stripprefix first, then cors, then security)
      - "traefik.http.routers.backend.middlewares=travelai-stripprefix,backend-cors,backend-security"

  # ============================================================================
  # React Frontend Service
  # Handles /travelai route (serves static files)
  # ============================================================================
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile

    container_name: travelai-frontend

    environment:
      - VITE_API_URL=http://68.233.112.202

    networks:
      - travelai-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    labels:
      - "traefik.enable=true"

      # Router configuration
      - "traefik.http.routers.frontend.rule=PathPrefix(`/travelai`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=5"

      # Service configuration
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.services.frontend.loadbalancer.server.scheme=http"

      # Middleware: Strip /travelai prefix
      - "traefik.http.middlewares.frontend-stripprefix.stripprefix.prefixes=/travelai"
      - "traefik.http.middlewares.frontend-stripprefix.stripprefix.forceslash=false"

      # Middleware: Security headers
      - "traefik.http.middlewares.frontend-security.headers.framedeny=true"
      - "traefik.http.middlewares.frontend-security.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.frontend-security.headers.browserxssfilter=true"
      - "traefik.http.middlewares.frontend-security.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.frontend-security.headers.customresponseheaders.X-Powered-By="

      # Middleware: Caching for static assets
      - "traefik.http.middlewares.frontend-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000"

      # Apply middlewares
      - "traefik.http.routers.frontend.middlewares=frontend-stripprefix,frontend-security"

# ============================================================================
# Networks
# ============================================================================
networks:
  travelai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
